name: Core validation

on:
  push:
    branches: [core-v2, 'core-v2.*', main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
      - name: Bootstrap core tests
        run: npm run test:bootstrap
      - name: Stage local runtime assets
        run: npm run setup
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Electron syntax
        run: node --check electron/main.cjs && node --check electron/preload.cjs

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  electron-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
      - run: npm run setup
      - run: npm run build
      - name: Production Electron smoke
        run: xvfb-run -a npm run test:electron
